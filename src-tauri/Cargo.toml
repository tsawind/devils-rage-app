[package]
name = "devils-rage-app"
version = "0.1.0"
description = "Devil's Rage desktop app: the corp mapper with native extras"
authors = ["Tsawind"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 layout: the app lives in a library so the same code can later
# build for iOS/Android as well as desktop.
name = "devils_rage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
dirs = "6"

# Self-update only exists on desktop; phones update through their app stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
