[package]
name = "devils-rage-app"
version = "0.1.0"
description = "Devil's Rage desktop app: the corp mapper with native extras"
authors = ["Tsawind"]
edition = "2021"
rust-version = "1.77"

[lib]
# Tauri 2 layout: the app lives in a library so the same code can later
# build for iOS/Android as well as desktop.
name = "devils_rage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
