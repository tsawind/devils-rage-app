[package]
name = "devils-rage-app"
version = "0.1.0"
description = "Devil's Rage desktop app: the corp mapper with native extras"
authors = ["Tsawind"]
license = "MIT"
repository = "https://github.com/tsawind/devils-rage-app"
edition = "2021"
rust-version = "1.85"

[lib]
# Tauri 2 layout: the app lives in a library so the same code can later
# build for iOS/Android as well as desktop.
name = "devils_rage_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "sync"] }
tauri-plugin-opener = "2"
tauri-plugin-log = "2"
log = "0.4"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Patch 47: the clipboard (way back after a jump, probe scans copied in EVE).
arboard = { version = "3", default-features = false }

# The title of the window in front ("EVE - <character>"), to know whose scan was copied.
[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"]

# Cameras: one EVE client's own sound (Windows process loopback) for the hole watch.
# Pinned to the commit whose API clientaudio.rs was written against.
[target.'cfg(windows)'.dependencies.wasapi]
git = "https://github.com/HEnquist/wasapi-rs"
rev = "8221dcaa19c46836afbdbac4b5b9a6ed6a2ad8ab"

# Self-update only exists on desktop; phones update through their app stores.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-autostart = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
