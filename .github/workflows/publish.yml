name: Publish stable

# Runs when a draft release is published on GitHub (the "ship it" button).
# Stable and beta both point at it (a beta tester gets the final release).
# Dev is left alone: the next push to main builds a dev version above this
# release anyway, and pointing dev at stable would move dev testers (whose
# channel follows their installed version) onto the stable channel.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  stable:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    concurrency: update-manifests
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point stable and beta at ${{ github.event.release.tag_name }}
        run: bash .github/scripts/publish-channel.sh "${{ github.event.release.tag_name }}" stable beta
      - name: Post the release to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TESTING: ${{ secrets.DISCORD_WEBHOOK_URL_TESTING }}
        run: python3 .github/scripts/discord-post.py "${{ github.event.release.tag_name }}" stable
