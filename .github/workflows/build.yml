name: Build

# Push to main       -> dev build, published as a pre-release, dev channel updated
# Tag v1.2.3-beta.1  -> beta build, published as a pre-release, beta channel updated
# Tag v1.2.3         -> stable build as a DRAFT release; publishing the draft on
#                       GitHub updates the stable channel (see publish.yml)
# Manual             -> Actions tab -> Build -> "Run workflow". Leave the box empty
#                       for a dev build, or type a version (0.2.0 or 0.2.0-beta.1)
#                       to make that release, exactly like pushing the tag.
on:
  push:
    branches: [main]
    tags: ['v*']
    # Docs and Discord-only changes don't need a new app build.
    paths-ignore:
      - '**.md'
      - '.github/workflows/announce.yml'
      - '.github/workflows/publish.yml'
      - '.github/scripts/discord-post.py'
  workflow_dispatch:
    inputs:
      release:
        description: 'Version to release, e.g. 0.2.0 (stable) or 0.2.0-beta.1. Empty = dev build.'
        required: false
        default: ''

permissions:
  contents: write

# One build at a time: two builds at once tripped over each other creating releases.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      draft: ${{ steps.v.outputs.draft }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        env:
          RELEASE: ${{ inputs.release }}
        run: python3 .github/scripts/version.py | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # macOS is off for now: GitHub rarely had a free Mac runner and nobody
          # in corp uses a Mac yet. To turn it back on, uncomment these two lines.
          # - platform: macos-latest
          #   args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./repair -> target

      - name: Devil's Rage Repair (bundled next to the app on Windows)
        run: |
          cargo test --manifest-path repair/Cargo.toml
          cargo build --release --manifest-path repair/Cargo.toml

      - name: App tests (chat log reader and friends)
        if: matrix.platform == 'ubuntu-22.04'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='${{ needs.version.outputs.version }}';fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Install Tauri CLI
        run: npm install

      # 22 Nov: Devil's Peepshow (previews, client bars, spots, hotkeys) is its own program with
      # its own installer. Built first, into the app's target folder (the shared code compiles
      # once, same profile settings as the app's build below); the app's Windows installer
      # carries it and runs it quietly.
      - name: Devil's Peepshow ${{ needs.version.outputs.version }}
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
          CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
          CARGO_PROFILE_RELEASE_STRIP: none
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          node -e "const f='peepshow/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='${{ needs.version.outputs.version }}';fs.writeFileSync(f,JSON.stringify(c,null,2))"
          (cd peepshow && npx tauri build)
          mkdir -p dist-peepshow
          setup=$(ls "$CARGO_TARGET_DIR"/release/bundle/nsis/Devils\ Peepshow_*-setup.exe | head -1)
          [ -n "$setup" ] || { echo "no Peepshow installer"; ls -R "$CARGO_TARGET_DIR/release/bundle"; exit 1; }
          cp "$setup" dist-peepshow/devils-peepshow-setup.exe
          cp "$setup.sig" dist-peepshow/devils-peepshow-setup.exe.sig
          # Out of the bundle folder, so the app's upload below only finds the app's files.
          rm -f "$CARGO_TARGET_DIR"/release/bundle/nsis/Devils\ Peepshow_*
          cat > src-tauri/peepshow-bundle.json <<'JSON'
          {"bundle": {"resources": {
            "../repair/target/release/devils-rage-repair.exe": "Devils Rage Repair.exe",
            "../dist-peepshow/devils-peepshow-setup.exe": "Devils Peepshow setup.exe"
          }}}
          JSON

      - name: Build and upload to release ${{ needs.version.outputs.tag }}
        uses: tauri-apps/tauri-action@v0
        env:
          # Windows: keep line numbers in a separate .pdb (the .exe doesn't grow), so a crash
          # spot from Windows can be named (uploaded to the release below).
          CARGO_PROFILE_RELEASE_DEBUG: ${{ matrix.platform == 'windows-latest' && 'line-tables-only' || '0' }}
          CARGO_PROFILE_RELEASE_STRIP: ${{ matrix.platform == 'windows-latest' && 'none' || 'symbols' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "Devil's Rage ${{ needs.version.outputs.version }}"
          releaseBody: "${{ needs.version.outputs.channel }} build. Windows: download the -setup.exe below."
          releaseDraft: ${{ needs.version.outputs.draft == 'true' }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          # 22 Nov: peepshow/ has a tauri.conf.json too; point at the app's own.
          projectPath: src-tauri
          args: ${{ matrix.args }} ${{ matrix.platform == 'windows-latest' && '--config peepshow-bundle.json' || '' }}

      - name: Devil's Peepshow to the release (installer and its update file)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="${{ needs.version.outputs.version }}"; tag="${{ needs.version.outputs.tag }}"
          name="devils-peepshow_${v}_x64-setup.exe"
          cp dist-peepshow/devils-peepshow-setup.exe "$name"
          gh release upload "$tag" "$name" --clobber -R "$GITHUB_REPOSITORY"
          SIG="$(cat dist-peepshow/devils-peepshow-setup.exe.sig)" URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$name" V="$v" \
            python -c "import json,os,datetime; p={'signature':os.environ['SIG'],'url':os.environ['URL']}; print(json.dumps({'version':os.environ['V'],'notes':'Devil\'s Peepshow','pub_date':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'platforms':{'windows-x86_64':p,'windows-x86_64-nsis':p}}, indent=2))" > peepshow-latest.json
          gh release upload "$tag" peepshow-latest.json --clobber -R "$GITHUB_REPOSITORY"

      - name: Debug symbols to the release (for reading crash spots)
        if: matrix.platform == 'windows-latest'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pdb=$(ls src-tauri/target/release/*.pdb 2>/dev/null | grep -i devils_rage_app | head -1)
          [ -n "$pdb" ] || { echo "no .pdb found"; ls src-tauri/target/release; exit 0; }
          cp "$pdb" "devils-rage-app-${{ needs.version.outputs.version }}.pdb"
          gh release upload "${{ needs.version.outputs.tag }}" "devils-rage-app-${{ needs.version.outputs.version }}.pdb" --clobber -R "$GITHUB_REPOSITORY"

  channel:
    # Stable waits for the draft to be published (publish.yml).
    needs: [version, build]
    # Still publish if one platform failed (e.g. GitHub had no free Mac runner):
    # latest.json then lists only the platforms that built.
    if: ${{ !cancelled() && needs.version.result == 'success' && needs.version.outputs.channel != 'stable' }}
    runs-on: ubuntu-latest
    concurrency: update-manifests
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Point the ${{ needs.version.outputs.channel }} channel at ${{ needs.version.outputs.tag }}
        run: bash .github/scripts/publish-channel.sh "${{ needs.version.outputs.tag }}" "${{ needs.version.outputs.channel }}"
      - name: Post the changes to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL_TESTING: ${{ secrets.DISCORD_WEBHOOK_URL_TESTING }}
        run: python3 .github/scripts/discord-post.py "${{ needs.version.outputs.tag }}" "${{ needs.version.outputs.channel }}"
      - name: Keep only the 5 newest dev releases
        if: needs.version.outputs.channel == 'dev'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev\\."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
