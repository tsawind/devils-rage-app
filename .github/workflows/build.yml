name: Build

# Push to main       -> dev build, published as a pre-release, dev channel updated
# Tag v1.2.3-beta.1  -> beta build, published as a pre-release, beta channel updated
# Tag v1.2.3         -> stable build as a DRAFT release; publishing the draft on
#                       GitHub updates the stable channel (see publish.yml)
# Manual             -> "Run workflow" on the Actions tab (same as a push to main)
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      channel: ${{ steps.v.outputs.channel }}
      draft: ${{ steps.v.outputs.draft }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        run: python3 .github/scripts/version.py | tee -a "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Stamp version ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version='${{ needs.version.outputs.version }}';fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Install Tauri CLI
        run: npm install

      - name: Build and upload to release ${{ needs.version.outputs.tag }}
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: "Devil's Rage ${{ needs.version.outputs.version }}"
          releaseBody: "${{ needs.version.outputs.channel }} build. Windows: download the -setup.exe below."
          releaseDraft: ${{ needs.version.outputs.draft == 'true' }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  channel:
    # Stable waits for the draft to be published (publish.yml).
    needs: [version, build]
    if: needs.version.outputs.channel != 'stable'
    runs-on: ubuntu-latest
    concurrency: update-manifests
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the ${{ needs.version.outputs.channel }} channel at ${{ needs.version.outputs.tag }}
        run: bash .github/scripts/publish-channel.sh "${{ needs.version.outputs.tag }}" "${{ needs.version.outputs.channel }}"
      - name: Keep only the 5 newest dev releases
        if: needs.version.outputs.channel == 'dev'
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("-dev\\."))] | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
