name: Check

# Branches other than main: compile and test on Windows (and Linux) without making a release,
# so Windows-only code (client sound, window capture) is checked before it reaches main.
on:
  push:
    branches-ignore: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./repair -> target

      - name: Devil's Rage Repair (bundled next to the app on Windows)
        run: |
          cargo test --manifest-path repair/Cargo.toml
          cargo build --release --manifest-path repair/Cargo.toml

      - name: Stand-in for Client Tools (the installer's resources must exist to compile)
        shell: bash
        run: mkdir -p src-tauri/target/release && touch src-tauri/target/release/devils-rage-client-tools.exe

      - name: Compile
        run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
