<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devil's Rage</title>
<style>
  :root { --bg:#0d0d10; --card:#16161a; --line:#2c2c33; --text:#e6e6ea; --muted:#8a8a92;
          --red:#a8181f; --red-hi:#d6242c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; user-select: none; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 24px; }
  .logo { border: 4px solid var(--red); border-radius: 18px; padding: 4px 18px; color: var(--red-hi);
          font-size: 44px; font-weight: 700; letter-spacing: 1px; }
  h1 { font-size: 24px; font-weight: 600; margin: 14px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sites { display: grid; grid-template-columns: repeat(2, 230px); gap: 18px; }
  button.site { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
                color: var(--text); padding: 26px 16px; cursor: pointer; font: inherit;
                display: flex; flex-direction: column; align-items: center; gap: 4px;
                transition: border-color .12s, transform .12s; }
  button.site:hover, button.site:focus-visible { border-color: var(--red-hi); outline: none;
                transform: translateY(-1px); }
  button.site svg { width: 34px; height: 34px; stroke: var(--red-hi); fill: none; stroke-width: 1.6;
                    stroke-linecap: round; stroke-linejoin: round; }
  button.site b { font-size: 19px; font-weight: 600; margin-top: 6px; }
  button.site span { color: var(--muted); font-size: 13px; }
  label.skip { margin-top: 22px; color: var(--muted); font-size: 13px; cursor: pointer;
               display: flex; align-items: center; gap: 8px; }
  label.skip input { accent-color: var(--red-hi); width: 15px; height: 15px; }
  footer { display: flex; align-items: center; gap: 18px; padding: 8px 14px;
           border-top: 1px solid #1f1f25; color: #6a6a72; font-size: 12px; }
  footer button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  footer button:hover { color: var(--text); }
  .grow { flex: 1; }
  .hint { color: #55555c; }
</style>
</head>
<body>
<main>
  <div class="logo">DR</div>
  <h1>Devil's Rage</h1>
  <p class="sub">Where to?</p>

  <div class="sites">
    <button class="site" data-site="mapper" autofocus>
      <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.2"/><circle cx="18" cy="5" r="2.2"/>
        <circle cx="12" cy="13" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="19" cy="18" r="2.2"/>
        <path d="M7 7l3.4 4.4M16.2 6.4l-2.6 4.9M10.6 14.7L7.5 17.4M13.9 14.2l3.3 2.6"/></svg>
      <b>Mapper</b><span>Chain, scanning, pings</span>
    </button>
    <button class="site" data-site="seat">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/>
        <circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.4-.3 4.3 1.1 4.8 4"/></svg>
      <b>SeAT</b><span>Characters, skills, FC tools</span>
    </button>
  </div>

  <label class="skip"><input type="checkbox" id="skip">
    <span>Skip this screen next time and open what I pick</span></label>
</main>

<footer>
  <span id="ver">…</span>
  <span class="hint">Back here any time: Home in the menu bar (Ctrl+Shift+H)</span>
  <span class="grow"></span>
  <button id="upd">Check for updates</button>
</footer>

<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

  invoke("app_info").then(info => {
    document.getElementById("ver").textContent = `${info.version} · ${info.channel}`;
    document.getElementById("skip").checked = !!info.start_page;
  }).catch(() => {});

  document.querySelectorAll("button.site").forEach(btn => {
    btn.addEventListener("click", () => {
      const remember = document.getElementById("skip").checked;
      invoke("open_site", { site: btn.dataset.site, remember }).catch(err => alert(err));
    });
  });

  document.getElementById("upd").addEventListener("click", () => invoke("check_updates"));
</script>
</body>
</html>
