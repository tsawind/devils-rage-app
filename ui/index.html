<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Devil's Rage</title>
<style>
  :root { --bg:#0d0d10; --card:#16161a; --line:#2c2c33; --text:#e6e6ea; --muted:#8a8a92;
          --red:#a8181f; --red-hi:#d6242c; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
         display: flex; flex-direction: column; user-select: none; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
         padding: 24px; }
  .logo { border: 4px solid var(--red); border-radius: 18px; padding: 4px 18px; color: var(--red-hi);
          font-size: 44px; font-weight: 700; letter-spacing: 1px; }
  h1 { font-size: 24px; font-weight: 600; margin: 14px 0 2px; }
  .sub { color: var(--muted); margin: 0 0 28px; }
  .sites { display: grid; grid-template-columns: repeat(4, 210px); gap: 16px; }
  @media (max-width: 960px) { .sites { grid-template-columns: repeat(2, 230px); } }
  button.site { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
                color: var(--text); padding: 26px 16px; cursor: pointer; font: inherit;
                display: flex; flex-direction: column; align-items: center; gap: 4px;
                transition: border-color .12s, transform .12s; }
  button.site:hover, button.site:focus-visible { border-color: var(--red-hi); outline: none;
                transform: translateY(-1px); }
  button.site svg { width: 34px; height: 34px; stroke: var(--red-hi); fill: none; stroke-width: 1.6;
                    stroke-linecap: round; stroke-linejoin: round; }
  button.site b { font-size: 19px; font-weight: 600; margin-top: 6px; }
  button.site span { color: var(--muted); font-size: 13px; }
  label.skip { margin-top: 22px; color: var(--muted); font-size: 13px; cursor: pointer;
               display: flex; align-items: center; gap: 8px; }
  label.skip input { accent-color: var(--red-hi); width: 15px; height: 15px; }
  footer { display: flex; align-items: center; gap: 18px; padding: 8px 14px;
           border-top: 1px solid #1f1f25; color: #6a6a72; font-size: 12px; }
  footer button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; padding: 0; }
  footer button:hover { color: var(--text); }
  .grow { flex: 1; }
  .hint { color: #55555c; }
  .motd { max-width: 478px; margin: 0 0 22px; padding: 10px 14px; border: 1px solid #5a2a14; border-radius: 10px;
          background: #1c120d; color: #f0c9a8; font-size: 14px; white-space: pre-wrap; text-align: center; }
  /* EVE client tools (coming): launch groups, multibox previews, client settings */
  .tools { margin-top: 26px; display: grid; grid-template-columns: repeat(3, 286px); gap: 12px; }
  @media (max-width: 960px) { .tools { grid-template-columns: repeat(1, 300px); } }
  .tools h2 { grid-column: 1 / -1; margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .8px;
              color: var(--muted); text-transform: uppercase; }
  button.tool { background: #121216; border: 1px dashed var(--line); border-radius: 10px; color: var(--text);
                padding: 12px 14px; cursor: pointer; font: inherit; text-align: left; display: flex; gap: 12px;
                align-items: center; }
  button.tool:hover, button.tool:focus-visible { border-color: var(--red-hi); outline: none; }
  button.tool svg { width: 26px; height: 26px; flex: none; stroke: var(--muted); fill: none; stroke-width: 1.6;
                    stroke-linecap: round; stroke-linejoin: round; }
  button.tool b { display: block; font-size: 15px; font-weight: 600; }
  button.tool span { color: var(--muted); font-size: 12px; }
  button.tool em { font-style: normal; font-size: 10px; letter-spacing: .5px; color: #c98a5a; border: 1px solid #5a2a14;
                   border-radius: 6px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .soon { margin-top: 10px; color: #c98a5a; font-size: 13px; min-height: 1.5em; }
  .motd b { display: block; font-size: 11px; letter-spacing: .6px; color: #c98a5a; margin-bottom: 2px; font-weight: 600; }
</style>
</head>
<body>
<main>
  <div class="logo">DR</div>
  <h1>Devil's Rage</h1>
  <p class="sub">Where to?</p>
  <div class="motd" id="motd" hidden><b>MESSAGE OF THE DAY</b><span id="motdText"></span></div>

  <div class="sites">
    <button class="site" data-site="mapper" autofocus>
      <svg viewBox="0 0 24 24"><circle cx="5" cy="6" r="2.2"/><circle cx="18" cy="5" r="2.2"/>
        <circle cx="12" cy="13" r="2.2"/><circle cx="6" cy="19" r="2.2"/><circle cx="19" cy="18" r="2.2"/>
        <path d="M7 7l3.4 4.4M16.2 6.4l-2.6 4.9M10.6 14.7L7.5 17.4M13.9 14.2l3.3 2.6"/></svg>
      <b>Mapper</b><span>Chain, scanning, pings</span>
    </button>
    <button class="site" data-site="seat">
      <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5"/>
        <circle cx="17" cy="9" r="2.4"/><path d="M15.8 14.2c2.4-.3 4.3 1.1 4.8 4"/></svg>
      <b>SeAT</b><span>Characters, skills, FC tools</span>
    </button>
    <button class="site" data-site="accounts">
      <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2"/><circle cx="9" cy="11" r="2.2"/>
        <path d="M5.8 16.5c.6-1.8 1.8-2.7 3.2-2.7s2.6.9 3.2 2.7M14.5 10h3.5M14.5 13.5h3.5"/></svg>
      <b>Your accounts</b><span>Logins, alts, order</span>
    </button>
    <button class="site" data-site="pi">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5.2"/><ellipse cx="12" cy="12" rx="10" ry="3.4" transform="rotate(-20 12 12)"/></svg>
      <b>PI</b><span>What to restart, where</span>
    </button>
  </div>

  <div class="tools">
    <h2>EVE clients</h2>
    <button class="tool" data-tool="launch">
      <svg viewBox="0 0 24 24"><path d="M12 3c3 2.2 4.5 5.4 4.5 9.2L14 15h-4l-2.5-2.8C7.5 8.4 9 5.2 12 3z"/><circle cx="12" cy="9" r="1.6"/>
        <path d="M8.2 13.5L5 16.5l3 .5M15.8 13.5l3.2 3-3 .5M10.5 17.5L12 21l1.5-3.5"/></svg>
      <div><b>Launch groups<em>SOON</em></b><span>Start a set of clients in one click</span></div>
    </button>
    <button class="tool" data-tool="multibox">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="8" height="7" rx="1.2"/><rect x="13" y="4" width="8" height="7" rx="1.2"/>
        <rect x="3" y="13" width="8" height="7" rx="1.2"/><rect x="13" y="13" width="8" height="7" rx="1.2"/></svg>
      <div><b>Multibox previews<em>NEW</em></b><span>Live thumbnails of every client, click to switch</span></div>
    </button>
    <button class="tool" data-tool="settings">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <div><b>Client settings<em>SOON</em></b><span>Copy one client's settings to the others</span></div>
    </button>
  </div>
  <p class="soon" id="soon"></p>

  <label class="skip"><input type="checkbox" id="skip">
    <span>Skip this screen next time and open what I pick</span></label>
</main>

<footer>
  <span id="ver">…</span>
  <span class="hint">Back here any time: Home in the top bar (Ctrl+Shift+H)</span>
  <span class="grow"></span>
  <button id="upd">Check for updates</button>
  <button id="set">Settings</button>
</footer>

<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);

  invoke("app_info").then(info => {
    document.getElementById("ver").textContent = `${info.version} · ${info.channel}`;
    document.getElementById("skip").checked = !!info.start_page;
    if (info.motd) {
      document.getElementById("motdText").textContent = info.motd;
      document.getElementById("motd").hidden = false;
    }
  }).catch(() => {});

  document.querySelectorAll("button.site").forEach(btn => {
    btn.addEventListener("click", () => {
      const remember = document.getElementById("skip").checked;
      invoke("open_site", { site: btn.dataset.site, remember }).catch(err => alert(err));
    });
  });

  // EVE client tools: placeholders for now (the app already sees every client's window).
  const SOON = {
    launch: "Launch groups are coming: pick characters once, start them together from here.",
    settings: "Client settings are coming: copy one character's EVE settings (windows, overview, keys) to the others.",
  };
  const soon = document.getElementById("soon");
  document.querySelectorAll("button.tool").forEach(btn => {
    btn.addEventListener("click", async () => {
      if (btn.dataset.tool === "multibox") {
        soon.textContent = "Opening a preview for each EVE client…";
        try {
          const n = await invoke("open_previews");
          soon.textContent = n ? `${n} preview${n === 1 ? "" : "s"} open. Click one to bring that client to the front; drag its title to move it.` : "No EVE clients are open.";
        } catch (e) { soon.textContent = String(e || "Couldn't open previews."); }
        return;
      }
      soon.textContent = SOON[btn.dataset.tool] || "";
    });
  });

  document.getElementById("upd").addEventListener("click", () => invoke("check_updates"));
  document.getElementById("set").addEventListener("click", () => { location.href = "settings.html"; });
</script>
</body>
</html>
