<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preview menu</title>
<style>
  html, body { margin: 0; background: #16161a; color: #e6e6ea; font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; overflow: hidden; }
  #box { border: 1px solid #3a3a42; border-radius: 8px; padding: 2px 0 4px; }
  .head { padding: 6px 10px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid #26262c; }
  .head b { flex: 1; color: #f0c040; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 5px; padding: 4px 10px; flex-wrap: wrap; }
  .lab { width: 54px; color: #8a8a92; flex: none; }
  .sep { border-top: 1px solid #26262c; margin: 2px 0; }
  .chip { border: 1px solid #3a3a42; border-radius: 6px; padding: 1px 7px; cursor: pointer; background: #101014; white-space: nowrap; }
  .chip:hover { border-color: #d6242c; }
  .chip.on { border-color: #f0c040; color: #f0c040; }
  .chip.off { opacity: .4; cursor: default; }
  .chip.main { border-color: #a8181f; background: #1c0d0e; }
  label.tick { display: flex; align-items: center; gap: 5px; cursor: pointer; margin-right: 8px; }
  input[type=checkbox] { margin: 0; accent-color: #d6242c; }
  input[type=range] { flex: 1; min-width: 80px; }
  input[type=number] { width: 52px; background: #101014; color: #eee; border: 1px solid #3a3a42; border-radius: 5px; padding: 1px 4px; font: inherit; }
  select { background: #101014; color: #eee; border: 1px solid #3a3a42; border-radius: 5px; font: inherit; padding: 1px 2px; }
  .it { padding: 4px 10px; cursor: pointer; display: flex; gap: 8px; }
  .it:hover { background: #24242b; }
  .it .k { width: 14px; color: #8a8a92; text-align: center; }
  #said { padding: 3px 10px; color: #adff2f; }
  #said.bad { color: #f27a7a; font-weight: 600; }
  #said:empty { display: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div id="box">
  <div class="head"><b id="title">…</b><span class="chip main" id="edit">Arrange</span></div>
  <div class="row"><label class="tick"><input type="checkbox" id="shown"> Shown</label><label class="tick" title="Clicks go straight through to the game; switch with the pedal / hotkeys"><input type="checkbox" id="through"> Click-through</label></div>
  <div class="row"><span class="lab">Opacity</span><input type="range" id="opacity" min="20" max="100" step="5"></div>
  <div class="row"><span class="lab">Size</span>
    <span class="chip" data-act="size-xs" title="A sixteenth of the monitor's width">XS</span>
    <span class="chip" data-act="size-s" title="A twelfth of the monitor's width">S</span>
    <span class="chip" data-act="size-m" title="An eighth of the monitor's width">M</span>
    <span class="chip" data-act="size-l" title="A sixth of the monitor's width">L</span>
    <span class="chip" data-act="smaller" title="10% smaller">−</span>
    <span class="chip" data-act="bigger" title="10% bigger">+</span>
  </div>
  <div class="row"><span class="lab"></span><input type="number" id="w" min="12" max="4000" step="10" title="Width (Enter)"> × <input type="number" id="h" min="8" max="4000" step="10" title="Height (Enter)">
    <span class="chip" data-act="size-all" title="Every preview gets this one's size">All this size</span></div>
  <div class="sep"></div>
  <div class="row"><label class="tick" title="While arranging, each monitor shows a grid and a dropped preview fills the cells it's over"><input type="checkbox" id="snap"> Snap</label>
    <select id="grid" title="Cells across and down each monitor">
      <option value="4">4×4</option><option value="6">6×6</option><option value="8">8×8</option><option value="12">12×12</option>
      <option value="16">16×16</option><option value="24">24×24</option><option value="32">32×32</option><option value="48">48×48 fine</option>
      <option value="64">64×64 finer</option><option value="96">96×96 finest</option><option value="custom">Custom…</option>
    </select>
    <span class="chip" data-act="snap-now" title="Snap this one to the grid now">Snap this</span>
  </div>
  <div class="row" id="customRow" hidden><span class="lab"></span><input type="number" id="cols" min="2" max="96" title="Across (Enter)"> × <input type="number" id="rows" min="2" max="96" title="Down (Enter)"></div>
  <div class="row"><span class="lab">Line up</span>
    <select id="scope"><option value="monitor">on this monitor</option><option value="stack">its stack</option></select>
    <span class="chip" data-line="row">Rows</span><span class="chip" data-line="col">Columns</span>
  </div>
  <div class="row" id="monRow"><span class="lab">Monitor</span><span id="mons" style="display:flex;gap:5px"></span><span style="flex:1"></span><span class="chip" data-act="undo" id="undo" title="Undo the last move">↶ Undo</span></div>
  <div class="sep"></div>
  <div class="it" id="place"><span class="k">⧉</span>Place clients…</div>
  <div class="it" id="placePrev"><span class="k">⧉</span>Place previews…</div>
  <div class="it" id="closeAll"><span class="k">✕</span>Close every preview</div>
  <div id="said"></div>
</div>
<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  let st = null;
  const fit = () => requestAnimationFrame(() => invoke("preview_menu_fit", { height: $("box").offsetHeight + 2 }).catch(() => {}));
  const say = (t, bad) => { $("said").textContent = t || ""; $("said").className = bad ? "bad" : ""; fit(); };
  const close = () => invoke("preview_menu_close").catch(() => {});
  const presets = [4, 6, 8, 12, 16, 24, 32, 48, 64, 96];

  async function load() {
    st = await invoke("preview_menu_state").catch(() => null);
    if (!st) return;
    $("title").textContent = st.name;
    $("edit").textContent = st.edit ? "Done arranging" : "Arrange";
    $("shown").checked = !!st.enabled;
    $("through").checked = !!st.clickThrough;
    $("opacity").value = String(Math.round((st.opacity || 1) * 100));
    $("snap").checked = !!st.snapOn;
    const square = st.cols === st.rows && presets.includes(st.cols);
    $("grid").value = square ? String(st.cols) : "custom";
    $("customRow").hidden = square;
    if (document.activeElement !== $("cols")) $("cols").value = st.cols;
    if (document.activeElement !== $("rows")) $("rows").value = st.rows;
    if (st.size) { if (document.activeElement !== $("w")) $("w").value = st.size[0]; if (document.activeElement !== $("h")) $("h").value = st.size[1]; }
    $("scope").querySelector('[value="stack"]').disabled = !st.inStack;
    if (!st.inStack) $("scope").value = "monitor";
    $("undo").classList.toggle("off", !st.canUndo);
    const mons = $("mons"); mons.innerHTML = "";
    for (let i = 0; i < st.monitors; i++) {
      const c = document.createElement("span");
      c.className = "chip" + (i === st.monitor ? " on" : "");
      c.textContent = String(i + 1);
      c.title = i === st.monitor ? "It's on this monitor" : `Move it to monitor ${i + 1}`;
      c.addEventListener("click", () => act("monitor", i));
      mons.append(c);
    }
    $("monRow").hidden = st.monitors < 2 && !st.canUndo;
    fit();
  }
  window.__menuFor = () => { say(""); load(); };

  async function act(action, value) {
    try { say(await invoke("preview_action", { name: st.name, action, value: value ?? null })); }
    catch (e) { say(String(e), true); }
    load();
  }
  for (const c of document.querySelectorAll("[data-act]")) c.addEventListener("click", () => { if (!c.classList.contains("off")) act(c.dataset.act); });
  for (const c of document.querySelectorAll("[data-line]")) c.addEventListener("click", () => act(`${c.dataset.line}-${$("scope").value}`));
  for (const box of [$("w"), $("h")]) box.addEventListener("keydown", (e) => { if (e.key === "Enter") act("size-set", Math.round(Number($("w").value)) * 100000 + Math.round(Number($("h").value))); });
  $("edit").addEventListener("click", async () => { await invoke("set_preview_edit", { on: !st.edit }).catch(() => {}); close(); });
  $("shown").addEventListener("change", (e) => invoke("set_preview_client", { name: st.name, enabled: e.target.checked }).then(load).catch(() => {}));
  $("through").addEventListener("change", (e) => invoke("set_preview_client", { name: st.name, clickThrough: e.target.checked }).then(load).catch(() => {}));
  $("opacity").addEventListener("input", (e) => invoke("set_preview_client", { name: st.name, opacity: Number(e.target.value) / 100 }).catch(() => {}));
  const grid = (on, cols, rows) => invoke("set_previews_snap_mode", { on, cols, rows }).then(() => {
    say(on ? (st.edit ? `Snap on: ${cols ?? st.cols}×${rows ?? st.rows} grid while arranging.` : "Snap on: it works while arranging (Arrange).") : "Snap off.");
    load();
  }).catch(() => {});
  $("snap").addEventListener("change", (e) => grid(e.target.checked, null, null));
  $("grid").addEventListener("change", (e) => {
    if (e.target.value === "custom") { $("customRow").hidden = false; fit(); $("cols").focus(); return; }
    const n = Number(e.target.value); grid(true, n, n);
  });
  for (const box of [$("cols"), $("rows")]) box.addEventListener("keydown", (e) => { if (e.key === "Enter") grid(true, Math.round(Number($("cols").value)), Math.round(Number($("rows").value))); });
  $("place").addEventListener("click", () => { invoke("place_clients_open", { previews: false }).catch(() => {}); close(); });
  $("placePrev").addEventListener("click", () => { invoke("place_clients_open", { previews: true }).catch(() => {}); close(); });
  $("closeAll").addEventListener("click", () => { invoke("close_previews").catch(() => {}); close(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  load();
</script>
</body>
</html>
