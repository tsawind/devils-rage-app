<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVE preview</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: transparent;
               font: 12px "Segoe UI", system-ui, sans-serif; color: #eee; user-select: none; }
  #pic { position: fixed; inset: 0; background: #000; }
  #shot { width: 100%; height: 100%; object-fit: contain; display: block; -webkit-user-drag: none; }
  #name { position: fixed; top: 0; left: 0; right: 0; padding: 3px 24px 6px 8px; font-weight: 600;
          background: linear-gradient(#000c, #0000); text-shadow: 0 1px 2px #000;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; z-index: 3; }
  /* The whole thumbnail: drag to move (edit mode) or click to bring the client forward. */
  #drag { position: fixed; inset: 0; z-index: 2; cursor: pointer; }
  body.edit #drag { cursor: move; }
  /* Patch 70: no loud frame on every preview; only the client in front lights up. */
  #frame { position: fixed; inset: 0; border: 1px solid #0006; pointer-events: none; box-sizing: border-box; z-index: 4; }
  body.edit #frame { border: 2px dashed #f0c040; }
  body.edit.through #frame { border-color: #3a6ea8; }
  /* The client in front right now. */
  body.active #frame { border: 3px solid #adff2f; }
  /* Patch 115/116: taken out of its stack (died, flying something else) and in no other: a frame
     in that stack's color round the outside (green inside it when in front). */
  body.groupoff:not(.edit) #frame { border: 3px solid var(--off, #ff8c1a); }
  body.groupoff.active:not(.edit) #frame { box-shadow: inset 0 0 0 3px #adff2f; }
  body.login #name { color: #f0c040; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3;
         text-align: center; padding: 16px; color: #c98a5a; pointer-events: none; }
  /* Edit mode toolbar */
  #bar { position: fixed; left: 4px; right: 4px; bottom: 4px; z-index: 6; display: none; gap: 6px; align-items: center;
         flex-wrap: wrap; background: #000c; border: 1px solid #333; border-radius: 6px; padding: 3px 6px; font-size: 11px; }
  /* Only while the pointer is over this preview, so small previews stay draggable and visible. */
  body.edit:hover #bar { display: flex; }
  #bar label { display: flex; align-items: center; gap: 3px; cursor: pointer; white-space: nowrap; }
  #bar input[type=range] { width: 60px; }
  #bar button { font: inherit; background: #1c0d0e; color: #f3c6c6; border: 1px solid #a8181f; border-radius: 4px; padding: 1px 7px; cursor: pointer; margin-left: auto; }
  #off { position: fixed; top: 40%; left: 0; right: 0; text-align: center; z-index: 3; display: none; color: #ddd; pointer-events: none; }
  body.edit.off #off { display: block; }
  #grip { position: fixed; right: 0; bottom: 0; width: 14px; height: 14px; z-index: 7; cursor: nwse-resize; display: none;
          background: linear-gradient(135deg, transparent 50%, #f0c040 50%); }
  body.edit #grip { display: block; }
  #close { position: fixed; top: 2px; right: 4px; width: 18px; height: 18px; line-height: 16px; text-align: center; z-index: 7;
           border-radius: 4px; background: #0008; color: #ccc; opacity: 0; transition: opacity .1s; cursor: pointer; }
  /* Patch 114: the ✕ only while arranging (edit preview layout). */
  body:not(.edit) #close { display: none; }
  body.edit:hover #close { opacity: 1; }
  /* Patch 116: one square per stack (group with a pedal key), first stack on the right, where the ✕
     is (left of it while editing). Lit: cycled in that stack. Outline: switched off in it. Faint:
     not in it (click to join). */
  #groups { position: fixed; top: 2px; right: 4px; z-index: 8; display: flex; flex-direction: row-reverse; gap: 4px; }
  body.edit #groups { right: 28px; }
  #groups .sq { width: 14px; height: 14px; cursor: pointer; border: 2px solid var(--c); border-radius: 3px; background: #0009; }
  #groups .sq.on { background: var(--c); box-shadow: inset 0 0 0 2px #000; }
  #groups .sq:hover { opacity: 1 !important; filter: brightness(1.3); }
  #bar input[type=number] { width: 48px; font: inherit; background: #111; color: #eee; border: 1px solid #444; border-radius: 3px; padding: 0 2px; }
  #close:hover { background: #a8181f; color: #fff; }
</style>
</head>
<body>
  <div id="pic"><img id="shot" alt=""></div>
  <div id="drag"></div>
  <div id="name">…</div>
  <div id="frame"></div>
  <div id="off">Hidden — tick “Shown” to keep it</div>
  <div id="msg" hidden></div>
  <div id="bar">
    <label title="Show this client's preview when previews are open"><input type="checkbox" id="shown"> Shown</label>
    <label title="Clicks go straight through to the game; switch with the pedal / hotkeys"><input type="checkbox" id="through"> Click-through</label>
    <label title="How see-through the preview is">Opacity <input type="range" id="opacity" min="20" max="100" step="5"></label>
    <label title="Size in pixels: type a width and height, Enter to apply">Size <input type="number" id="sizeW" min="80" max="4000" step="10"> × <input type="number" id="sizeH" min="45" max="4000" step="10"></label>
    <button id="done" title="Lock every preview in place">Done</button>
  </div>
  <div id="grip" title="Drag to resize"></div>
  <div id="close" title="Close this preview">✕</div>
  <div id="groups"></div>

<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const qs = new URLSearchParams(location.search);
  const name = (window.__PREVIEW_NAME__ != null ? String(window.__PREVIEW_NAME__) : "") || qs.get("name") || "";
  document.getElementById("name").textContent = name;
  document.title = name + " · preview";
  document.body.classList.toggle("login", /^Login \d+$/.test(name));

  const shot = document.getElementById("shot");
  const msg = document.getElementById("msg");
  const drag = document.getElementById("drag");
  let stopped = false, failures = 0, mode = { edit: false, enabled: true, clickThrough: false, opacity: 1 };

  // The app pushes the mode here (edit on/off, shown, click-through, opacity).
  window.__previewMode = (m) => {
    mode = m;
    document.body.classList.toggle("edit", !!m.edit);
    document.body.classList.toggle("off", !m.enabled);
    document.body.classList.toggle("through", !!m.clickThrough);
    document.getElementById("pic").style.opacity = String(m.enabled ? m.opacity * (m.master ?? 1) : 0.25);
    // Only movable in edit mode.
    if (m.edit) drag.setAttribute("data-tauri-drag-region", ""); else drag.removeAttribute("data-tauri-drag-region");
    document.getElementById("shown").checked = !!m.enabled;
    document.getElementById("through").checked = !!m.clickThrough;
    document.getElementById("opacity").value = String(Math.round((m.opacity || 1) * 100));
    drawStacks(m.stacks || []);
    showSize();
  };
  invoke("preview_mode", { name }).then(window.__previewMode).catch(() => {});
  // The app pushes the client in front the moment it changes (no waiting for a picture).
  window.__previewActive = (front) => document.body.classList.toggle("active", front === name);
  invoke("active_client").then(window.__previewActive).catch(() => {});

  async function tick() {
    if (stopped) return;
    try {
      const url = await invoke("preview_frame", { name, width: Math.min(1280, Math.round(window.innerWidth * (window.devicePixelRatio || 1))) });
      shot.src = url;
      msg.hidden = true;
      failures = 0;
    } catch (e) {
      failures++;
      // Give a minimized / closed client a moment before saying so.
      if (failures > 2) { msg.textContent = String(e || "no picture"); msg.hidden = false; }
    }
    // Fewer pictures a second each when many previews are open (asked every ~10 pictures).
    if (++ticks % 10 === 1) wait = await invoke("preview_interval").catch(() => 500);
    setTimeout(tick, wait);
  }
  let ticks = 0, wait = 500;
  tick();

  // Click (without dragging) brings that client forward — not while arranging.
  // Patch 114: a login screen preview can be dragged any time (it moves once the pointer travels).
  const isLogin = /^Login \d+$/.test(name);
  let downAt = null;
  drag.addEventListener("mousedown", (e) => { if (e.button === 0) downAt = { x: e.screenX, y: e.screenY }; });
  drag.addEventListener("mousemove", (e) => {
    if (!downAt || mode.edit || !isLogin || !(e.buttons & 1)) return;
    if (Math.abs(e.screenX - downAt.x) + Math.abs(e.screenY - downAt.y) < 5) return;
    downAt = null;
    invoke("preview_start_drag").catch(() => {});
  });
  drag.addEventListener("mouseup", (e) => {
    if (!downAt) return;
    const moved = Math.abs(e.screenX - downAt.x) + Math.abs(e.screenY - downAt.y);
    downAt = null;
    if (moved < 5 && !mode.edit) invoke("preview_focus", { name }).catch(() => {});
  });

  // Edit toolbar.
  document.getElementById("shown").addEventListener("change", (e) => invoke("set_preview_client", { name, enabled: e.target.checked }).catch(() => {}));
  document.getElementById("through").addEventListener("change", (e) => invoke("set_preview_client", { name, clickThrough: e.target.checked }).catch(() => {}));
  document.getElementById("opacity").addEventListener("input", (e) => invoke("set_preview_client", { name, opacity: Number(e.target.value) / 100 }).catch(() => {}));
  document.getElementById("done").addEventListener("click", () => invoke("set_preview_edit", { on: false }).catch(() => {}));

  // Patch 116: the stack squares ("on", "off" = switched off in it, "out" = not in it).
  const groupsBox = document.getElementById("groups");
  function drawStacks(stacks) {
    mode.stacks = stacks;
    groupsBox.innerHTML = "";
    // Patch 118: only the stacks this character is in (join or leave one on the Launch groups page).
    for (const st of stacks.filter(x => x.state !== "out")) {
      const sq = document.createElement("div");
      sq.className = "sq " + st.state;
      sq.style.setProperty("--c", st.color);
      sq.title = st.name + (st.state === "on" ? ": on its pedal. Click to take this client out." : st.state === "off" ? ": taken out. Click to put it back in." : "")
        + (st.remember ? " (its EVE window moves with it)" : "");
      sq.addEventListener("mousedown", (e) => e.stopPropagation());
      sq.addEventListener("click", (e) => {
        e.stopPropagation();
        const on = st.state !== "on", was = mode.stacks;
        drawStacks(was.map(x => x.id === st.id ? { ...x, state: on ? "on" : "off" } : x));
        invoke("set_preview_group", { name, group: st.id, on }).catch((err) => {
          drawStacks(was);
          msg.textContent = String(err || "Couldn't change the stack"); msg.hidden = false;
          setTimeout(() => { msg.hidden = true; }, 4000);
        });
      });
      groupsBox.append(sq);
    }
    // The frame: taken out of a stack and not cycled in any.
    const off = stacks.find(x => x.state === "off");
    const taken = !!off && !stacks.some(x => x.state === "on");
    document.body.classList.toggle("groupoff", taken);
    if (off) document.body.style.setProperty("--off", off.color);
    document.getElementById("name").style.paddingRight = (8 + 18 * groupsBox.children.length + (mode.edit ? 24 : 0)) + "px";
  }

  // Patch 114: type a size (physical pixels, like the saved layout).
  const sizeW = document.getElementById("sizeW"), sizeH = document.getElementById("sizeH");
  function showSize() {
    const dpr = window.devicePixelRatio || 1;
    if (document.activeElement !== sizeW) sizeW.value = String(Math.round(window.innerWidth * dpr));
    if (document.activeElement !== sizeH) sizeH.value = String(Math.round(window.innerHeight * dpr));
  }
  window.addEventListener("resize", showSize);
  for (const box of [sizeW, sizeH]) {
    box.addEventListener("mousedown", (e) => e.stopPropagation());
    box.addEventListener("change", () => {
      const width = Math.round(Number(sizeW.value)), height = Math.round(Number(sizeH.value));
      if (width >= 80 && height >= 45) invoke("preview_resize", { width, height }).catch(() => {});
    });
    box.addEventListener("keydown", (e) => { if (e.key === "Enter") box.blur(); });
  }

  // Resize from the corner (edit mode).
  const grip = document.getElementById("grip");
  let sizing = null, pending = null;
  grip.addEventListener("pointerdown", (e) => {
    const dpr = window.devicePixelRatio || 1;
    sizing = { x: e.screenX, y: e.screenY, w: window.innerWidth * dpr, h: window.innerHeight * dpr, dpr };
    grip.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener("pointermove", (e) => {
    if (!sizing) return;
    const width = Math.round(sizing.w + (e.screenX - sizing.x) * sizing.dpr);
    const height = Math.round(sizing.h + (e.screenY - sizing.y) * sizing.dpr);
    if (pending) return;
    pending = setTimeout(() => { pending = null; invoke("preview_resize", { width, height }).catch(() => {}); }, 30);
  });
  grip.addEventListener("pointerup", () => { sizing = null; });

  document.getElementById("close").addEventListener("click", (e) => {
    e.stopPropagation();
    stopped = true;
    invoke("close_preview").catch(() => {});
  });
</script>
</body>
</html>
