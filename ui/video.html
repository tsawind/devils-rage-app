<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture (dev)</title>
<style>
  :root { --bg:#0a0a0c; --panel:#121216; --line:#24242c; --text:#c9c9d0; --muted:#6a6a72; --hi:#fff; --red-hi:#d6242c; --ok:#7fd45a; --bad:#ff6a5a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font: 12px/1.35 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column; }
  #bar { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; padding: 6px; border-bottom: 1px solid var(--line); }
  select, button { background: var(--panel); border: 1px solid var(--line); border-radius: 5px; color: var(--text); font: inherit; padding: 4px 7px; }
  button { cursor: pointer; }
  button:hover { border-color: var(--red-hi); color: var(--hi); }
  button:disabled, select:disabled { opacity: .5; cursor: default; }
  #source { max-width: 210px; }
  #snap, #go { font-weight: 600; }
  #go.on { border-color: var(--red-hi); color: #ff8a7a; }
  #more { display: none; gap: 5px; flex-wrap: wrap; align-items: center; }
  body.more #more { display: flex; }
  #boxes { display: flex; flex-wrap: wrap; gap: 4px 10px; padding: 0 6px; }
  #boxes:empty { display: none; }
  .bx { display: flex; align-items: center; gap: 3px; color: var(--muted); }
  .bx button { padding: 0 5px; }
  #said { padding: 3px 8px; color: var(--muted); min-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ok { color: var(--ok) !important; } .bad { color: var(--bad) !important; }
  #view { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 4px; }
  #still { cursor: crosshair; }
</style>
</head>
<body>
  <div id="bar">
    <select id="source" title="What to capture"></select>
    <button id="refresh" title="A new still of the source">⟳</button>
    <label title="Keep the picture moving (a new picture every second)" style="display: inline-flex; align-items: center; gap: 3px"><input type="checkbox" id="live"> Live</label>
    <button id="snap" title="Save the boxes switched on (none: all of it) at full size, with every detail. Press as often as you like.">Snapshot</button>
    <button id="go" title="Record the boxes switched on (none: all of it)">● Record</button>
    <button id="opts" title="Video settings, clear boxes">⋯</button>
    <span id="more">
      <select id="fps" title="Pictures a second"><option value="1">1 / s</option><option value="2" selected>2 / s</option><option value="5">5 / s</option><option value="10">10 / s</option><option value="15">15 / s</option></select>
      <select id="quality" title="Quality (file size)"><option value="55">Low</option><option value="75" selected>Medium</option><option value="90">High (sharp text)</option></select>
      <select id="size" title="Full or half size"><option value="full" selected>Full size</option><option value="half">Half size</option></select>
      <button id="clear" title="Remove every box">Clear boxes</button>
      <button id="videos" title="Open the folder the videos go to">Videos</button>
      <button id="pictures" title="Open the folder the snapshots go to">Pictures</button>
      <button id="where" title="Pick another folder for Videos, Pictures and Scans (another drive, say)">Change folder…</button>
      <button id="back" title="Back to the app's own folder" hidden>Back to default</button>
      <span id="whereText" style="font-size: 11px; opacity: .75"></span>
    </span>
  </div>
  <div id="boxes"></div>
  <div id="said">Drag on the still to draw a box.</div>
  <div id="view"><canvas id="still"></canvas></div>
<script>
  "use strict";
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args || {});
  const $ = (id) => document.getElementById(id);
  const canvas = $("still"), ctx = canvas.getContext("2d");
  // cur: the source the boxes shown belong to (they're kept per source, by its name).
  let targets = [], still = null, src = { w: 1, h: 1 }, boxes = [], drag = null, on = false, cur = null;
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem("dev-video") || "{}") || {}; } catch (e) { saved = {}; }
  function keep() {
    saved.source = cur || saved.source;
    saved.live = $("live") ? $("live").checked : saved.live;
    saved.fps = $("fps").value; saved.quality = $("quality").value; saved.size = $("size").value; saved.more = document.body.classList.contains("more");
    saved.boxes = saved.boxes || {}; if (saved.source) saved.boxes[saved.source] = boxes;
    try { localStorage.setItem("dev-video", JSON.stringify(saved)); } catch (e) {}
  }
  function say(t, cls) { $("said").textContent = t; $("said").className = cls || ""; }
  const target = () => (targets[+$("source").value] || {}).target;
  const onBoxes = () => boxes.filter((b) => b.on).map((b) => b.r);
  async function loadTargets() {
    targets = await invoke("dev_snapshot_targets").catch(() => []);
    $("source").innerHTML = targets.map((t, i) => `<option value="${i}">${t.label.replace(/</g, "&lt;")}</option>`).join("");
    const at = targets.findIndex((t) => t.label === saved.source);
    if (at >= 0) $("source").value = String(at);
    cur = targets[+$("source").value] ? targets[+$("source").value].label : null;
    for (const k of ["fps", "quality", "size"]) if (saved[k]) $(k).value = saved[k];
    document.body.classList.toggle("more", !!saved.more);
  }
  async function loadStill() {
    const t = target();
    if (!t) return;
    try {
      const r = await invoke("dev_video_still", { target: t });
      src = { w: r.w, h: r.h };
      const img = new Image();
      img.onload = () => { still = img; canvas.width = img.width; canvas.height = img.height; fit(); draw(); };
      img.src = "data:image/jpeg;base64," + r.jpeg;
      boxes = ((saved.boxes || {})[cur] || []).map((b) => ({ ...b }));
      listBoxes();
      if (!$("said").className) say(`${r.w} × ${r.h}: drag on the still to draw a box.`);
    } catch (e) { say(`Couldn't take a still: ${e}`, "bad"); }
  }
  // 21 Nov: Live: a new picture every second (boxes untouched; paused while drawing one).
  let liveBusy = false;
  async function refreshPicture() {
    const t = target();
    if (!t || liveBusy || drag) return;
    liveBusy = true;
    try {
      const r = await invoke("dev_video_still", { target: t });
      const img = new Image();
      img.onload = () => {
        if (drag) return;
        src = { w: r.w, h: r.h };
        still = img;
        if (canvas.width !== img.width || canvas.height !== img.height) { canvas.width = img.width; canvas.height = img.height; fit(); }
        draw();
      };
      img.src = "data:image/jpeg;base64," + r.jpeg;
    } catch (e) { /* the next second tries again */ } finally { liveBusy = false; }
  }
  setInterval(() => { if ($("live").checked && !document.hidden) refreshPicture(); }, 1000);
  // The still always fits the window, however small it's made.
  function fit() {
    if (!still) return;
    const v = $("view"), k = Math.min((v.clientWidth - 8) / still.width, (v.clientHeight - 8) / still.height);
    canvas.style.width = `${Math.max(40, still.width * k)}px`; canvas.style.height = `${Math.max(30, still.height * k)}px`;
  }
  new ResizeObserver(fit).observe($("view"));
  const k = () => canvas.width / src.w;
  function draw() {
    if (!still) return;
    ctx.drawImage(still, 0, 0);
    const lw = Math.max(2, canvas.width / 500);
    ctx.lineWidth = lw;
    boxes.forEach((b, i) => {
      ctx.strokeStyle = b.on ? "#3fd0ff" : "rgba(160,160,170,.7)";
      ctx.setLineDash(b.on ? [] : [lw * 3, lw * 2]);
      ctx.strokeRect(b.r[0] * k(), b.r[1] * k(), b.r[2] * k(), b.r[3] * k());
      ctx.fillStyle = ctx.strokeStyle; ctx.font = `bold ${Math.round(lw * 7)}px Segoe UI`;
      ctx.fillText(String(i + 1), b.r[0] * k() + lw * 3, b.r[1] * k() + lw * 8);
    });
    ctx.setLineDash([]);
    if (drag) { ctx.strokeStyle = "#ffd24a"; ctx.strokeRect(drag.x0, drag.y0, drag.x1 - drag.x0, drag.y1 - drag.y0); }
  }
  function listBoxes() {
    const box = $("boxes"); box.innerHTML = "";
    boxes.forEach((b, i) => {
      const row = document.createElement("label"); row.className = "bx"; row.title = `${b.r[2]} × ${b.r[3]} at ${b.r[0]}, ${b.r[1]}`;
      const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = b.on; cb.disabled = on;
      cb.addEventListener("change", () => { b.on = cb.checked; keep(); draw(); });
      const t = document.createElement("span"); t.textContent = `Box ${i + 1}`;
      const x = document.createElement("button"); x.textContent = "✕"; x.disabled = on; x.title = "Remove this box";
      x.addEventListener("click", (e) => { e.preventDefault(); boxes.splice(i, 1); keep(); listBoxes(); draw(); });
      row.append(cb, t, x); box.append(row);
    });
  }
  // Mouse to the still's own pixels, kept inside it.
  const pos = (e) => {
    const r = canvas.getBoundingClientRect();
    const x = Math.min(Math.max(0, (e.clientX - r.left) * canvas.width / r.width), canvas.width);
    const y = Math.min(Math.max(0, (e.clientY - r.top) * canvas.height / r.height), canvas.height);
    return [x, y];
  };
  canvas.addEventListener("mousedown", (e) => { if (on || !still) return; const [x, y] = pos(e); drag = { x0: x, y0: y, x1: x, y1: y }; });
  window.addEventListener("mousemove", (e) => { if (!drag) return; const [x, y] = pos(e); drag.x1 = x; drag.y1 = y; draw(); });
  window.addEventListener("mouseup", () => {
    if (!drag) return;
    let x = Math.round(Math.min(drag.x0, drag.x1) / k()), y = Math.round(Math.min(drag.y0, drag.y1) / k());
    let w = Math.round(Math.abs(drag.x1 - drag.x0) / k()), h = Math.round(Math.abs(drag.y1 - drag.y0) / k());
    drag = null;
    w = Math.min(w, src.w - x); h = Math.min(h, src.h - y);
    // Even sizes, so half size halves cleanly.
    w -= w % 2; h -= h % 2;
    if (w > 16 && h > 16) { boxes.push({ r: [x, y, w, h], on: true }); keep(); listBoxes(); }
    draw();
  });
  $("source").addEventListener("change", () => {
    keep();
    cur = targets[+$("source").value] ? targets[+$("source").value].label : null;
    boxes = ((saved.boxes || {})[cur] || []).map((b) => ({ ...b }));
    keep(); listBoxes(); say(""); loadStill();
  });
  for (const id of ["fps", "quality", "size"]) $(id).addEventListener("change", keep);
  $("live").checked = !!saved.live;
  $("live").addEventListener("change", () => { saved.live = $("live").checked; keep(); });
  $("refresh").addEventListener("click", loadStill);
  $("opts").addEventListener("click", () => { document.body.classList.toggle("more"); keep(); fit(); });
  // 21 Nov: Videos and Pictures where the app lives (or a folder picked here).
  const showWhere = (w) => {
    $("whereText").textContent = `Saving in ${w.root}${w.picked ? "" : " (default)"}`;
    $("back").hidden = !w.picked;
    if (w.problem) say(w.problem, "bad");
  };
  invoke("dev_recordings_folder").then(showWhere).catch(() => {});
  $("videos").addEventListener("click", () => invoke("dev_open_kind", { kind: "videos" }).then((d) => say(`Videos are in ${d}`)).catch((e) => say(String(e), "bad")));
  $("pictures").addEventListener("click", () => invoke("dev_open_kind", { kind: "pictures" }).then((d) => say(`Pictures are in ${d}`)).catch((e) => say(String(e), "bad")));
  $("where").addEventListener("click", () => invoke("dev_recordings_choose", { reset: false }).then(showWhere).catch((e) => say(String(e), "bad")));
  $("back").addEventListener("click", () => invoke("dev_recordings_choose", { reset: true }).then(showWhere).catch((e) => say(String(e), "bad")));
  $("clear").addEventListener("click", () => { boxes = []; keep(); listBoxes(); draw(); });
  $("snap").addEventListener("click", async () => {
    $("snap").disabled = true;
    try { say(`Saved ${await invoke("dev_snapshot_boxes", { target: target(), boxes: onBoxes() })}`, "ok"); } catch (e) { say(`Couldn't: ${e}`, "bad"); }
    $("snap").disabled = false;
  });
  $("go").addEventListener("click", async () => {
    if (on) { await invoke("dev_video_stop"); return; }
    const spec = { target: target(), boxes: onBoxes(), fps: +$("fps").value, quality: +$("quality").value, half: $("size").value === "half" };
    try { await invoke("dev_video_start", { spec }); say("Recording…", "ok"); } catch (e) { say(`Couldn't start: ${e}`, "bad"); }
  });
  async function poll() {
    try {
      const st = await invoke("dev_video_status");
      const was = on; on = !!st.on;
      $("go").textContent = on ? `■ Stop ${Math.floor(st.secs / 60)}:${String(st.secs % 60).padStart(2, "0")}` : "● Record";
      $("go").classList.toggle("on", on);
      for (const id of ["source", "fps", "quality", "size", "refresh", "clear"]) $(id).disabled = on;
      if (on) say(`Recording: ${st.frames} pictures · ${st.mb.toFixed(1)} MB · ${st.files} file${st.files === 1 ? "" : "s"}`, "ok");
      else if (was) say(`Video saved: ${st.frames} pictures, ${st.mb.toFixed(1)} MB in ${st.files} files (vid-…)`, "ok");
      if (was !== on) listBoxes();
    } catch (e) {}
  }
  loadTargets().then(loadStill);
  setInterval(poll, 1000);
</script>
</body>
</html>
