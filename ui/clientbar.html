<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Client bar</title>
<style>
  :root { --red:#a8181f; --red-hi:#d6242c; --ok:#adff2f; --purple:#a970ff; --line:#33333b; --text:#e6e6ea; --muted:#8a8a92;
          --top: 31px; --edge: #3b3b44; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; overflow: hidden; font: 12px/1.4 "Segoe UI", system-ui, sans-serif; color: var(--text); user-select: none; }
  .bar { height: 34px; display: flex; align-items: center; gap: 2px; padding: 0 4px; background: rgba(12, 12, 15, .86);
         border: 1px solid var(--line); border-top: 0; border-radius: 0 0 9px 9px; }
  .b { width: 30px; height: 28px; border: 0; border-radius: 6px; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; }
  .b:hover { background: #22222a; color: var(--text); }
  .b svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .b.fold { width: 20px; }
  .grip { width: 16px; height: 28px; display: grid; place-items: center; color: #55555e; cursor: move; flex: none; font-size: 13px; letter-spacing: -2px; }
  .grip:hover { color: var(--text); }
  body.frame .grip { display: none; }
  .b.drag { width: 46px; cursor: grab; color: var(--ok); }
  .b.drag.off { cursor: not-allowed; opacity: .35; }
  .b.lock.on { color: #ffcf5a; }
  .b.cam { color: var(--purple); }
  .b.cam.rec { color: #ff4d4d; }
  .b.x:hover { background: var(--red); color: #fff; }
  .b.x.sure { background: var(--red-hi); color: #fff; width: 58px; font-size: 11px; font-weight: 600; }
  .gap { flex: 1; }
  .title, .ring { display: none; }

  /* Buttons left out in ⚙ → Buttons on the bar. */
  .nobtn { display: none !important; }

  /* Small bar shrunk (›): just ⚙ and ✕. */
  body.mini:not(.frame) .bar > .b:not(.fold):not(#gear):not(#close) { display: none !important; }
  body.mini:not(.frame) #close { display: grid !important; }
  body.mini:not(.frame) .b.fold svg { transform: rotate(180deg); }
  body.right:not(.frame) .bar { width: fit-content; margin-left: auto; }
  body.center:not(.frame) .bar { width: fit-content; margin: 0 auto; }
  body:not(.right):not(.center):not(.frame) .bar { width: fit-content; }

  /* Frame mode (Fixed Window client with room above): our own title bar + a 1 px edge, like
     Windows' (1918×1024 inside → 1920×1056). The middle is cut out: the client shows through. */
  body.frame .ring { display: block; position: fixed; inset: 0; border: 1px solid var(--edge); pointer-events: none; }
  body.frame .bar { position: absolute; top: 0; left: 0; right: 0; height: var(--top); border: 1px solid var(--edge); border-bottom: 0;
                    border-radius: 0; background: #17171c; padding: 0 2px 0 10px; }
  body.frame .title { display: block; flex: 1; align-self: stretch; line-height: calc(var(--top) - 2px); color: #c9c9d0; font-size: 12px;
                      cursor: grab; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  body.frame.locked .title { cursor: default; }
  /* 20 Nov: how much this character shares, like Your accounts: Spy red ✕, Ally blue, Public purple. */
  .mark { display: none; flex: none; align-self: center; width: 13px; height: 13px; margin: 0 4px 0 6px; border-radius: 50%;
          font: 700 10px/13px sans-serif; text-align: center; color: #fff; }
  body.mark-spy .mark { display: block; background: #d93636; border-radius: 3px; }
  body.mark-spy .mark::before { content: "✕"; }
  body.mark-ally .mark { display: block; background: #3d8bfd; }
  body.mark-public .mark { display: block; background: #a370f7; }
  body.frame .b.fold, body.frame .b.drag, body.frame .gap { display: none; }
  .title.nudge { color: #ffcf5a; }

  .menu { position: absolute; top: 38px; left: 0; width: 300px; background: rgba(16, 16, 20, .97); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; display: none; }
  body.right .menu { left: auto; right: 0; }
  body.frame .menu { top: calc(var(--top) + 2px); left: auto; right: 0; }
  .menu.on { display: block; }
  .menu h4 { margin: 0 0 4px; font-size: 13px; }
  .menu .m { color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .menu button.it { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); padding: 4px 6px; border-radius: 6px; cursor: pointer; font: inherit; }
  .menu button.it:hover { background: #22222a; }
  .menu .row { display: flex; gap: 4px; margin: 4px 0; flex-wrap: wrap; }
  .menu .row button { flex: 1; background: #121216; border: 1px solid var(--line); color: var(--text); border-radius: 6px; padding: 2px 6px; cursor: pointer; font: inherit; white-space: nowrap; }
  .menu .row button.on { border-color: var(--red-hi); background: #1c0d0e; }
  .menu .row button.lockon { border-color: #ffcf5a; color: #ffcf5a; }
  .say { color: var(--muted); font-size: 11px; min-height: 1.3em; margin-top: 4px; word-break: break-word; }
  .say.ok { color: var(--ok); }
  .say.bad { color: #f08a8a; }
  .size { display: flex; align-items: center; gap: 4px; margin: 4px 0; }
  .size input[type=number] { width: 64px; background: #0d0d10; border: 1px solid var(--line); border-radius: 6px; color: var(--text); font: inherit; padding: 1px 4px; }
  .menu label.m { display: flex; align-items: center; gap: 5px; cursor: pointer; }
  .menu .warnline { color: #ffcf5a; font-size: 11px; }
  .menu button.go { width: 100%; background: #1c0d0e; border: 1px solid var(--red-hi); color: var(--text); border-radius: 6px; padding: 3px 6px; cursor: pointer; font: inherit; }
  .menu button.go.sure { background: var(--red-hi); }
  hr { border: 0; border-top: 1px solid #25252c; margin: 6px 0; }
</style>
</head>
<body class="right">
<div class="ring"></div>
<div class="bar">
  <span class="mark" id="mark"></span>
  <span class="title" id="title" title="Drag here to move the client"></span>
  <span class="grip" id="grip" title="Drag to put the bar anywhere on its client (Left / Middle / Right in ⚙ puts it back)">⋮⋮</span>
  <button class="b fold" id="fold" title="Shrink the bar to just ⚙ and ✕">
    <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
  <button class="b lock" id="lock" data-btn="lock" title="Lock this client in place"></button>
  <button class="b drag" id="drag" data-btn="move" title="Hold and drag to move the client (snaps to corners, edges and middle lines; never resized)">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg></button>
  <button class="b cam" id="cam" data-btn="camera" title="Camera (mapper surveillance) and recordings for this client">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="13" height="11" rx="2"/><path d="M15.5 10.5l6-3.5v10l-6-3.5z"/></svg></button>
  <button class="b" id="pop" data-btn="popout" title="Pop out (on top of EVE): the mapper's scanner for this character">
    <svg viewBox="0 0 24 24"><rect x="2.5" y="4.5" width="19" height="15" rx="2"/><rect x="11.5" y="11" width="8" height="6" rx="1"/></svg></button>
  <span class="gap"></span>
  <button class="b" id="gear" title="This client: lock, buttons, spot, profile, launch groups">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  <button class="b" id="min" data-btn="minimize" title="Minimise this client">
    <svg viewBox="0 0 24 24"><path d="M5 17h14"/></svg></button>
  <button class="b x" id="close" data-btn="close" title="Close this client (click twice)">
    <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
</div>

<div class="menu" id="camMenu">
  <h4 id="camTitle">Camera</h4>
  <div class="m">Surveillance on the mapper (Share a camera): every camera and watch area set up for this client.</div>
  <div class="row"><button id="camOn">Camera on</button><button id="camOff">Camera off</button></div>
  <button class="it" id="camShare">Open Share a camera</button>
  <hr>
  <div class="m">Dev recordings (this PC)</div>
  <button class="it" id="snap">📷 Snapshot of this client</button>
  <button class="it" id="vid">⏺ Record video of this client (2/s)</button>
  <button class="it" id="vid10">⏺ Record video, fast (10/s)</button>
  <button class="it" id="folder">📁 Open the recordings folder</button>
  <div class="say" id="camSay"></div>
</div>

<div class="menu" id="gearMenu">
  <h4 id="who"></h4>
  <div class="m" id="where"></div>
  <div class="m" id="profile"></div>
  <div class="row"><button id="lockIt">🔓 Unlocked: can be moved</button></div>
  <hr>
  <div id="modeBox">
    <div class="m" id="modeNote"></div>
    <div class="size"><span class="m" style="margin:0">Size</span><input type="number" id="mw" min="640" max="7680"> × <input type="number" id="mh" min="480" max="4320"></div>
    <label class="m" id="mFloatRow"><input type="checkbox" id="mFloat"> Floating: small bar only, no title bar of ours</label>
    <div class="warnline" id="modeWarn"></div>
    <button class="go" id="modeGo"></button>
    <button class="go" id="liveGo" style="margin-top:4px; background:#121216; border-color: var(--line)">Resize now, no restart (experiment)</button>
    <div class="say" id="modeSay"></div>
  </div>
  <div class="row" id="floatRow"><button id="floatT"></button></div>
  <hr>
  <div class="row" id="gearMore">
    <button id="gCam">📹 Camera…</button><button id="gMin">— Minimise</button>
  </div>
  <hr>
  <div class="m">Buttons on the bar (⚙ is always there)</div>
  <div class="row" id="btns">
    <button data-b="lock">🔒 Lock</button><button data-b="move">✥ Move</button><button data-b="camera">📹 Camera</button>
    <button data-b="popout">⧉ Pop out</button><button data-b="minimize">— Minimise</button><button data-b="close">✕ Close</button>
  </div>
  <div class="m">Bar sits</div>
  <div class="row" id="corners">
    <button data-c="left">Left</button><button data-c="center">Middle</button><button data-c="right">Right</button>
  </div>
  <hr>
  <button class="it" data-page="setups.html">Setups (where clients open, keys, overview)</button>
  <button class="it" data-page="profiles.html">Client settings (profiles, copies, backups)</button>
  <button class="it" data-page="tuning.html">Client tuning (graphics, sound tiers)</button>
  <button class="it" data-page="launch.html">Launch groups</button>
  <hr>
  <button class="it" id="hide">Take the bar off this client</button>
  <div class="say" id="gearSay"></div>
</div>

<script>
  const invoke = (cmd, args) => window.__TAURI_INTERNALS__.invoke(cmd, args);
  const $ = (id) => document.getElementById(id);
  const NAME = window.__CLIENT_NAME__ || "";
  const LOCKED_SVG = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>';
  const OPEN_SVG = '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.8-1.2"/></svg>';
  let locked = false, menu = null, closeArmed = null, state = null, info = null, profileHint = null, modeArmed = false, sharers = null;

  // Frame mode on / off (sent by the app when the client gets / loses room for our title bar).
  window.setMode = (frame, top) => {
    document.body.classList.toggle("frame", !!frame);
    if (top) document.documentElement.style.setProperty("--top", top + "px");
  };

  function showLock() {
    document.body.classList.toggle("locked", locked);
    $("lock").innerHTML = locked ? LOCKED_SVG : OPEN_SVG;
    $("lock").classList.toggle("on", locked);
    $("lock").title = locked ? "Locked in place: click to unlock" : "Click to lock this client in place";
    $("drag").classList.toggle("off", locked);
    $("lockIt").textContent = locked ? "🔒 Locked in place (click to unlock)" : "🔓 Unlocked: can be moved (click to lock)";
    $("lockIt").classList.toggle("lockon", locked);
  }
  async function setLock(on) {
    locked = on;
    showLock();
    await invoke("clientbar_lock", { name: NAME, locked }).catch(() => {});
  }
  const say = (id, text, cls) => { $(id).textContent = text || ""; $(id).className = "say" + (cls ? " " + cls : ""); };
  const back = () => invoke("clientbar_focus_client", { name: NAME }).catch(() => {});

  function openMenu(which) {
    closeMenus();
    menu = which;
    $(which).classList.add("on");
    invoke("clientbar_menu", { height: $(which).offsetHeight + 44 }).catch(() => {});
  }
  function closeMenus() {
    if (!menu) return;
    $(menu).classList.remove("on");
    menu = null;
    invoke("clientbar_menu", { height: null }).catch(() => {});
  }
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeMenus(); back(); } });
  window.addEventListener("blur", () => { closeMenus(); disarmClose(); });

  $("lock").addEventListener("click", async () => { await setLock(!locked); back(); });
  $("lockIt").addEventListener("click", () => setLock(!locked));

  async function drag() {
    closeMenus();
    try { await invoke("clientbar_drag", { name: NAME }); } catch (err) { console.warn(err); }
  }
  $("drag").addEventListener("pointerdown", (e) => { if (!locked && e.button === 0) drag(); });
  $("title").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    if (locked) {
      $("title").classList.add("nudge");
      $("title").textContent = titleText() + "   🔒 locked in place (⚙ to unlock)";
      setTimeout(() => { $("title").classList.remove("nudge"); $("title").textContent = titleText(); }, 1500);
      return;
    }
    drag();
  });
  // A login screen ("Login 2"): its account from its sign-in token (certain), else from the
  // profile it was started with.
  let loginLabel = "";
  const titleText = () => "EVE - " + NAME + (loginLabel ? " · " + loginLabel : "");
  $("title").textContent = titleText();
  // 20 Nov: in Client Tools (no mapper), no camera or scanner pop-out buttons.
  if (window.__CLIENT_TOOLS__) for (const id of ["cam", "pop"]) $(id).style.display = "none";
  // 20 Nov: Spy / Ally / Public mark (checked again now and then: it can change in Your accounts).
  const loadMark = () => invoke("character_mark", { name: NAME }).then((m) => {
    for (const k of ["spy", "ally", "public"]) document.body.classList.toggle("mark-" + k, m === k);
    $("mark").title = m === "spy" ? "Spy: locked on this PC, never shared" : m === "ally" ? "Ally" : m === "public" ? "Public only" : "";
  }).catch(() => {});
  if (!NAME.startsWith("Login ")) { loadMark(); setInterval(loadMark, 30000); }
  if (NAME.startsWith("Login ")) {
    (async () => {
      const profile = await invoke("clientbar_login_profile", { name: NAME }).catch(() => null);
      const user = await invoke("clientbar_login_account", { name: NAME }).catch(() => null);
      if (!profile && !user) return;
      if (profile) profileHint = profile;
      const seat = await invoke("seat_launch_groups").catch(() => ({ accounts: [] }));
      const accounts = seat.accounts || [];
      const byUser = user ? accounts.find(a => a.launcher_user_id != null && String(a.launcher_user_id) === String(user)) : null;
      // By profile only when that account isn't known to be another EVE account than this one.
      const byProfile = profile ? accounts.find(a => String(a.profile) === String(profile)) : null;
      const profileOk = byProfile && !(user && byProfile.launcher_user_id != null && String(byProfile.launcher_user_id) !== String(user));
      const acct = byUser || (profileOk ? byProfile : null);
      const warn = byUser && profile && String(byUser.profile) !== String(profile) ? ` ⚠ started with settings_${profile}` : "";
      loginLabel = acct ? `Account ${acct.nickname} (${(acct.characters || []).map(c => c.name).join(", ")})${warn}` : user ? `EVE account ${user} (not in Your accounts)` : `settings_${profile}`;
      $("title").textContent = titleText();
      if (acct) invoke("clientbar_place_like", { name: NAME, like: (acct.characters || []).map(c => c.name) }).catch(() => {});
    })();
  }
  $("grip").addEventListener("pointerdown", (e) => {
    if (e.button !== 0) return;
    closeMenus();
    invoke("clientbar_move_bar", { name: NAME }).catch(err => console.warn(err));
  });
  // ⧉ Pop out: the mapper's scanner for this character, on top of EVE.
  let charId = null;
  invoke("seat_launch_groups").then(seat => {
    for (const a of seat.accounts || []) for (const c of a.characters || []) if (c.name === NAME) charId = c.id;
  }).catch(() => {});
  $("pop").addEventListener("click", async () => {
    if (!charId) { $("pop").title = "This character isn't in SeAT, so the mapper can't pop it out"; return; }
    try { $("pop").title = await invoke("clientbar_popout", { id: Number(charId), name: NAME }); } catch (e) { $("pop").title = String(e); }
  });

  const minimize = () => { closeMenus(); invoke("clientbar_minimize", { name: NAME }).catch(() => {}); };
  $("min").addEventListener("click", minimize);
  $("gMin").addEventListener("click", minimize);

  function disarmClose() {
    clearTimeout(closeArmed); closeArmed = null;
    $("close").classList.remove("sure");
    $("close").innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  }
  $("close").addEventListener("click", () => {
    if (!closeArmed) {
      $("close").classList.add("sure");
      $("close").textContent = "Close?";
      closeArmed = setTimeout(disarmClose, 2500);
      return;
    }
    disarmClose();
    invoke("clientbar_close", { name: NAME }).catch(() => {});
  });

  // 📹 Camera (mapper surveillance) and dev recordings of this client.
  const target = { kind: "client", name: NAME };
  let videoTimer = null;
  async function videoState() {
    const s = await invoke("dev_video_status").catch(() => null);
    const on = !!s?.on;
    $("cam").classList.toggle("rec", on);
    $("vid").textContent = on ? `⏹ Stop video (${s.secs}s, ${s.frames} pictures, ${s.mb.toFixed(0)} MB)` : "⏺ Record video of this client (2/s)";
    $("vid10").style.display = on ? "none" : "";
    return on;
  }
  async function openCamera() {
    if (menu === "camMenu") { closeMenus(); back(); return; }
    $("camTitle").textContent = "Camera · " + NAME;
    await videoState();
    openMenu("camMenu");
  }
  $("cam").addEventListener("click", openCamera);
  $("gCam").addEventListener("click", () => { closeMenus(); openCamera(); });
  $("snap").addEventListener("click", async () => {
    say("camSay", "Taking it…");
    try { say("camSay", "Saved " + await invoke("dev_snapshot_take", { target }), "ok"); } catch (e) { say("camSay", String(e), "bad"); }
  });
  async function video(fps) {
    if (await videoState()) {
      await invoke("dev_video_stop").catch(() => {});
      clearInterval(videoTimer); videoTimer = null;
      setTimeout(videoState, 300);
      say("camSay", "Stopped.", "ok");
      return;
    }
    try {
      await invoke("dev_video_start", { spec: { target, boxes: [], fps, quality: 80, half: false } });
      say("camSay", `Recording at ${fps}/s…`, "ok");
      clearInterval(videoTimer); videoTimer = setInterval(videoState, 1000);
      setTimeout(videoState, 300);
    } catch (e) { say("camSay", String(e), "bad"); }
  }
  $("vid").addEventListener("click", () => video(2));
  $("vid10").addEventListener("click", () => video(10));
  $("folder").addEventListener("click", () => invoke("dev_open_recordings").then(m => say("camSay", m)).catch(e => say("camSay", String(e), "bad")));
  for (const [id, on] of [["camOn", true], ["camOff", false]]) {
    $(id).addEventListener("click", async () => {
      say("camSay", "…");
      try { say("camSay", await invoke("clientbar_camera", { name: NAME, on }), "ok"); } catch (e) { say("camSay", String(e), "bad"); }
    });
  }
  $("camShare").addEventListener("click", async () => {
    try { say("camSay", await invoke("clientbar_camera", { name: NAME, on: true }).then(() => "Share a camera is open.")); } catch (e) { say("camSay", String(e), "bad"); }
  });
  setInterval(() => { if (menu !== "camMenu") videoState(); }, 3000);

  // ⚙ This client.
  $("gear").addEventListener("click", async () => {
    if (menu === "gearMenu") { closeMenus(); back(); return; }
    $("who").textContent = NAME;
    info = await invoke("clientbar_info", { name: NAME }).catch(() => null);
    const f = info?.frame;
    $("where").textContent = f ? `${f.w}×${f.h} at ${f.x}, ${f.y}` : "Minimised";
    if (info) { locked = !!info.locked; showLock(); }
    const seat = await invoke("seat_launch_groups").catch(() => ({ accounts: [], groups: [] }));
    const acct = (seat.accounts || []).find(a => (a.characters || []).some(c => c.name === NAME));
    const groups = (seat.groups || []).map(x => x.group).filter(g => (g.members || []).some(m => m.name === NAME)).map(g => g.name);
    profileHint = acct?.profile || profileHint;
    fillMode();
    $("profile").textContent = loginLabel ? `Login screen · ${loginLabel}${profileHint ? " · settings_" + profileHint : ""}` : (acct ? `Account ${acct.nickname}${acct.profile ? " · settings_" + acct.profile : ""}` : "Account not in SeAT yet") +
      (groups.length ? ` · launch group${groups.length > 1 ? "s" : ""}: ${groups.join(", ")}` : "");
    applyState(await invoke("clientbar_state").catch(() => null));
    say("gearSay", "");
    openMenu("gearMenu");
  });
  document.querySelectorAll("#corners button").forEach(b => b.addEventListener("click", async () => {
    await invoke("clientbar_corner", { corner: b.dataset.c, name: NAME }).catch(() => {});
    applyState(await invoke("clientbar_state").catch(() => null));
  }));
  document.querySelectorAll("#btns button").forEach(b => b.addEventListener("click", async () => {
    const now = new Set(state?.buttons || []);
    now.has(b.dataset.b) ? now.delete(b.dataset.b) : now.add(b.dataset.b);
    await invoke("clientbar_buttons", { buttons: [...now] }).catch(() => {});
    applyState(await invoke("clientbar_state").catch(() => null));
  }));
  document.querySelectorAll("[data-page]").forEach(b => b.addEventListener("click", () => {
    closeMenus();
    invoke("clientbar_open_page", { page: b.dataset.page }).catch(e => say("gearSay", String(e), "bad"));
  }));
  $("hide").addEventListener("click", () => invoke("clientbar_set", { name: NAME, on: false }).catch(e => say("gearSay", String(e), "bad")));
  $("fold").addEventListener("click", async () => {
    const mini = !document.body.classList.contains("mini");
    await invoke("clientbar_mini", { name: NAME, on: mini }).catch(() => {});
    closeMenus(); applyState(await invoke("clientbar_state").catch(() => null)); back();
  });

  // The Devil's window mode: Window mode ↔ Fixed Window at the same size and spot (closes the client once).
  function fillMode() {
    const windowed = info?.windowMode !== false;
    const size = info?.size || { w: 1918, h: 1024 };
    $("mw").value = size.w; $("mh").value = size.h;
    modeArmed = false; $("modeGo").classList.remove("sure");
    $("mFloatRow").style.display = windowed ? "" : "none";
    $("mFloat").checked = false;
    $("floatRow").style.display = windowed ? "none" : "";
    $("floatT").textContent = info?.floating ? "Title bar: floating small bar (click for our title bar)" : "Title bar: ours (click for the floating small bar)";
    $("modeNote").textContent = windowed
      ? "Try the Devil's window mode: EVE's Fixed Window at this same size and spot, with our title bar, so Windows can never resize or half-snap it. Only needed once per profile: afterwards EVE's own Display Mode switch keeps the size."
      : `Fixed Window ${size.w}×${size.h}. Back to Window mode at:`;
    $("modeGo").textContent = windowed ? "Switch to the Devil's window mode" : "Back to Window mode";
    $("liveGo").style.display = windowed ? "none" : "";
    $("modeWarn").textContent = "The client closes first (if EVE asks, pick Quit); the app changes its profile, then you launch it again.";
    say("modeSay", "");
    // 21 Nov: other open clients in the same profile (settings_Default, often) rewrite it as they
    // close, so they have to close too.
    sharers = null;
    invoke("clientbar_profile_sharers", { name: NAME }).then((s) => {
      if (!s?.profile) return;
      sharers = s;
      const others = s.others || [];
      const shared = s.profile.toLowerCase() === "default"
        ? " settings_Default is EVE's shared profile: every account without its own profile changes with it (Your accounts can give each account its own)."
        : "";
      $("modeWarn").textContent = others.length
        ? `settings_${s.profile} is also open in ${others.join(", ")}. All ${others.length + 1} clients close (if EVE asks, pick Quit), then the profile changes for all of them.${shared}`
        : `${NAME} uses settings_${s.profile}. It closes first (if EVE asks, pick Quit); the app changes the profile, then you launch it again.${shared}`;
    }).catch(() => {});
  }
  $("liveGo").addEventListener("click", async () => {
    const width = Math.round(+$("mw").value), height = Math.round(+$("mh").value);
    try { say("modeSay", await invoke("clientbar_resize_live", { name: NAME, width, height }), "ok"); } catch (e) { say("modeSay", String(e), "bad"); }
  });
  $("floatT").addEventListener("click", async () => {
    await invoke("clientbar_floating", { name: NAME, on: !info?.floating }).catch(() => {});
    if (info) info.floating = !info.floating;
    fillMode();
  });
  $("modeGo").addEventListener("click", async () => {
    const width = Math.round(+$("mw").value), height = Math.round(+$("mh").value);
    if (!(width >= 640 && height >= 480)) { say("modeSay", "Pick a size of at least 640×480.", "bad"); return; }
    if (!modeArmed) {
      modeArmed = true;
      $("modeGo").classList.add("sure");
      $("modeGo").textContent = (width < 1024 || height < 768)
        ? `${width}×${height} is under 1024×768: EVE's windows get cramped. Click again to close ${NAME} anyway`
        : (sharers?.others?.length ? `Click again to close all ${sharers.others.length + 1} clients in settings_${sharers.profile} and switch` : `Click again to close ${NAME} and switch`);
      return;
    }
    modeArmed = false;
    const toFixed = info?.windowMode !== false;
    try {
      say("modeSay", await invoke("clientbar_window_mode", { name: NAME, toFixed, width, height, floating: toFixed && $("mFloat").checked, profile: profileHint, withOthers: !!sharers?.others?.length }), "ok");
    } catch (e) { say("modeSay", String(e), "bad"); fillMode(); }
  });

  // Which buttons show, shrunk or whole, and which side the bar sits (changed here or on Home).
  function applyState(st) {
    if (!st) return;
    state = st;
    const shown = new Set(st.buttons || ["move", "close"]);
    document.querySelectorAll("[data-btn]").forEach(el => el.classList.toggle("nobtn", !shown.has(el.dataset.btn)));
    document.querySelectorAll("#btns button").forEach(b => b.classList.toggle("on", shown.has(b.dataset.b)));
    document.querySelectorAll("#corners button").forEach(b => b.classList.toggle("on", b.dataset.c === st.corner));
    const mini = (st.mini || []).includes(NAME);
    document.body.classList.toggle("mini", mini);
    document.body.classList.toggle("right", st.corner === "right");
    document.body.classList.toggle("center", st.corner === "center");
    $("fold").title = mini ? "Show the whole bar" : "Shrink the bar to just ⚙ and ✕";
  }
  const refreshState = () => invoke("clientbar_state").then(applyState).catch(() => {});
  setInterval(() => { if (!menu) refreshState(); }, 2000);
  refreshState();

  invoke("clientbar_info", { name: NAME }).then(i => {
    locked = !!i?.locked; showLock();
    if (i?.titleBar) window.setMode(i.titleBar.on, i.titleBar.top);
  }).catch(showLock);
  showLock();
</script>
</body>
</html>
